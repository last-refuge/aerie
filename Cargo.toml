[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/last-refuge/aerie"

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
aerie-core = { path = "crates/aerie-core" }
aerie-drive = { path = "crates/aerie-drive" }
aerie-store = { path = "crates/aerie-store" }
aerie-sync = { path = "crates/aerie-sync" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
oauth2 = "5"
oo7 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
