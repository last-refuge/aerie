[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/last-refuge/aether"

[workspace.dependencies]
aether-core = { path = "crates/aether-core" }
aether-drive = { path = "crates/aether-drive" }
aether-store = { path = "crates/aether-store" }
aether-sync = { path = "crates/aether-sync" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
