[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/last-refuge/aerie"

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
aerie-core = { path = "crates/aerie-core" }
aerie-drive = { path = "crates/aerie-drive" }
aerie-engine = { path = "crates/aerie-engine" }
aerie-store = { path = "crates/aerie-store" }
aerie-sync = { path = "crates/aerie-sync" }
async-channel = "2"
axum = "0.8"
gio = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
notify = "8"
oauth2 = "5"
oo7 = "0.6"
# Matches gtk4's pango; 1.56 adds per-app font files.
pango = { version = "0.22", features = ["v1_56"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
